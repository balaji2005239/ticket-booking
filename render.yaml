# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and provisions both resources below in one go, wiring DATABASE_URL from
# the database to the web service automatically.
#
# --workers 1 is deliberate, not a typo: app/scheduler.py runs an
# APScheduler background thread inside the Flask app process to sweep
# expired seat holds / waitlist offers (see app/__init__.py). Each gunicorn
# worker is a separate process with its own app instance, so >1 worker
# would mean >1 scheduler independently sweeping the same rows. Harmless
# (row locking makes it safe) but wasteful and not the intended design —
# this project is explicitly single-instance in scope, see PROJECT_BRIEF.md.
services:
  - type: web
    name: ticket-booking-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-booking-db
          property: connectionString
      - key: HOLD_TTL_SECONDS
        value: "600"
      - key: OFFER_TTL_SECONDS
        value: "600"
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "30"
      # Frontend is served by this same Flask app (see app/__init__.py), so
      # this should just be the service's own public URL. Render assigns
      # that URL from the `name` above — if it differs (e.g. name taken),
      # update this value in the dashboard after first deploy; it's only
      # used to build the waitlist "claim your seat" email link.
      - key: FRONTEND_BASE_URL
        # Actual assigned URL (the plain "ticket-booking-api" name was taken,
        # Render suffixed it) — was wrong here until this fix; if you ever
        # recreate this service under a different name, update this too, and
        # also update it directly in the existing service's dashboard (a
        # render.yaml change alone doesn't override an already-set env var
        # on a service that already exists).
        value: https://ticket-booking-api-1sps.onrender.com
      # Email is optional — without BREVO_API_KEY, send_email() fails soft
      # (logs and skips) so booking/waitlist flows still work, just without
      # real emails going out. Fill this in via the Render dashboard
      # (Environment tab); sync:false keeps it out of this file / the repo.
      # NOTE: this is genuinely Brevo's HTTP API, not SMTP — Render blocks
      # outbound SMTP entirely (confirmed by testing: valid SMTP credentials
      # authenticate fine from an unrestricted network, then time out on
      # every port when run on Render). See app/utils/email.py's docstring.
      # Get this from Brevo's dashboard: SMTP & API -> API Keys (NOT the
      # SMTP tab — that's a different credential and won't work here).
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: noreply@yourticketapp.com
      - key: EMAIL_FROM_NAME
        value: Ticket Booking

databases:
  - name: ticket-booking-db
    plan: free
